schema_version: 1
recipe: native16_roi_cf

model:
  type: gligen_sd14
  pretrained_model: ${NATIVE16_MODEL_ROOT}/gligen-1-4-generation-text-box
  stack_manifest: ../model_stacks/native16_roi_cf_init.yaml
  radiometric_bridge_checkpoint: ${NATIVE16_PARENT_ARTIFACT_ROOT}/native16_radiometric_bridge_stage1_v1/checkpoint-008000.pt
  style_adapter_checkpoint: ${NATIVE16_PARENT_ARTIFACT_ROOT}/native16_style_adapter_affine_cont100_v5/final.pt
  radiometric_transport: g065
  vae_subfolder: vae
  revision: null
  variant: fp16
  use_safetensors: false
  height: 512
  width: 512
  pixel_channels: 3
  text_encoder_precision: fp16
  vae_precision: fp32
  instance_fusion:
    enabled: true
    rank: 64
    feather_power: 2.5
    preferred_extent: 2.5
    log_sigma: 1.10
    minimum_scale_weight: 0.08
    strength: 0.85

data:
  type: custom
  root: ${NATIVE16_DATA_ROOT}/infrared_uav/detector_ir16_v1
  annotation_file: ${NATIVE16_DATA_ROOT}/infrared_uav/metadata_full_v1/flir_ir16_train.jsonl
  input_mode: native16_bridge
  thermal16:
    field: thermal16
    require_all: true
    profile_path: ${NATIVE16_DATA_ROOT}/infrared_uav/detector_ir16_v1/radiometric_profile.json
  class_names: [person, bike, car, motor, bus, truck, other_vehicle]
  phrase_aliases: {bike: bicycle, motor: motorcycle, other_vehicle: vehicle}
  prompt_from_labels: true
  prompt_prefix: a thermal infrared road scene containing
  num_classes: 128
  max_boxes: 30
  random_flip: true
  square_crop: true
  random_crop: true
  bbox_focus_probability: 0.65
  min_visible_fraction: 0.50
  min_box_area: 0.00001
  ref_size: 224
  sampling:
    strategy: weighted
    dataset_weights: {FLIR_ADAS_v2: 1.0}
    layout_weights: {default: 3.0, small: 1.5, crowded: 1.0}
    samples_per_epoch: 16000
    replacement: true

condition:
  box_dropout: 0.03
  text_dropout: 0.02
  cfg_dropout: 0.03
  box_jitter_probability: 0.35
  box_jitter_center_std: 0.035
  box_jitter_scale_std: 0.035

train:
  mode: instance_fusion
  precision: bf16
  seed: 20260812
  batch_size: 1
  num_workers: 3
  epochs: 100
  max_steps: 300
  gradient_accumulation_steps: 2
  learning_rate: 0.00002
  learning_rate_groups:
    base_unet: 0.000000001
    cross_attention: 0.000000001
    grounding: 0.00002
  warmup_steps: 50
  scheduler_total_steps: 300
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  max_grad_norm: 0.30
  gradient_checkpointing: true
  attention_slicing: false
  xformers: false
  drop_last: true
  min_snr_gamma: 5.0
  bbox_loss_weight: 1.5
  instance_core_loss_weight: 0.15
  instance_core_loss_warmup_steps: 75
  instance_core_loss_max_ratio: 0.10
  instance_core_feather_power: 2.5
  attention_box_loss_weight: 0.0
  teacher_distill_weight: 0.20
  teacher_distill_interval: 2
  teacher_distill_warmup_steps: 50
  teacher_distill_max_ratio: 0.08
  counterfactual_loss_weight: 0.30
  counterfactual_loss_warmup_steps: 75
  counterfactual_loss_max_ratio: 0.10
  counterfactual_negative_candidates: 8
  counterfactual_core_fraction: 0.76
  counterfactual_relative_margin: 0.04
  counterfactual_temperature: 0.10
  counterfactual_outside_weight: 0.75
  resume: null

distributed:
  enabled: true
  precision: bf16
  cpu_offload: false
  auto_wrap_min_params: 10000000
  forward_prefetch: false
  timeout_minutes: 60

sample:
  precision: fp16
  num_steps: 40
  guidance_scale: 10.0
  gligen_scheduled_sampling_beta: 1.0
  seed: 20260812
  output_dir: ${NATIVE16_ARTIFACT_ROOT}/native16_roi_cf_pilot300_v2/samples

output:
  dir: ${NATIVE16_ARTIFACT_ROOT}/native16_roi_cf_pilot300_v2
  save_every_steps: 50
