# Multi-dataset style training: all available thermal clips, annotations optional.
schema_version: 1
global_state:
  butiv_root: ${BUTIV_ROOT}
  flir_root: ${FLIR_ROOT}
  ltir_root: ${LTIR_ROOT}
  zut_root: ${ZUT_ROOT}
  ms2_root: ${MS2_ROOT}
  vivid_root: ${VIVID_ROOT}
  lynred_root: ${LYNRED_ROOT}
  tartan_root: ${TARTAN_ROOT}

dataset:
  _class_name: dwm.datasets.common.DatasetAdapter
  base_dataset:
    _class_name: torch.utils.data.ConcatDataset
    datasets:
      - _class_name: dwm.datasets.butiv.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: butiv_root
        split: all
        sequence_length: 4
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 30.0
        max_frames_per_sequence: 256
        annotation_mode: none
        return_annotations: false
      - _class_name: dwm.datasets.flir.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: flir_root
        split: train
        modality: thermal
        view_mode: single
        sequence_length: 4
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 30.0
        annotation_mode: none
        return_annotations: false
        normalize_uint16: false
      - _class_name: dwm.datasets.ltir_v1.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: ltir_root
        mode: all
        sequence_length: 4
        max_frames_per_sequence: 256
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 25.0
        annotation_mode: none
        return_annotations: false
        normalize_uint16: true
      - _class_name: dwm.datasets.zut_fir_adas.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: zut_root
        frame_directory: 16BitFrames
        split: all
        sequence_length: 4
        max_frames_per_sequence: 256
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 25.0
        annotation_mode: none
        include_empty_frames: true
        return_annotations: false
        normalize_uint16: true
      - _class_name: dwm.datasets.ms2.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: ms2_root
        sequence_length: 4
        max_frames_per_sequence: 256
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 10.0
        annotation_mode: none
        return_annotations: false
        normalize_uint16: true
      - _class_name: dwm.datasets.vivid_pp.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: vivid_root
        modality: thermal
        view_mode: single
        subsets: [driving_full, driving_vision, handheld_indoor, handheld_outdoor]
        max_frames_per_bag: 256
        sequence_length: 4
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 30.0
        annotation_mode: none
        return_annotations: false
        normalize_uint16: true
      - _class_name: dwm.datasets.lynred_mobility.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: lynred_root
        bit_depth: 16bits
        resolution: vga
        sequence_length: 4
        max_frames_per_sequence: 256
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 30.0
        annotation_mode: none
        return_annotations: false
        normalize_uint16: true
      - _class_name: dwm.datasets.tartanrgbt.MotionDataset
        dataset_root:
          _class_name: dwm.common.get_state
          key: tartan_root
        camera: left
        view_mode: single
        sequence_length: 4
        max_frames_per_sequence: 256
        fps_stride_tuples: [[0.0, 1.0]]
        source_fps: 10.0
        annotation_mode: none
        return_annotations: false
        normalize_uint16: true
  transform_list:
    - old_key: images
      new_key: vae_images
      transform:
        _class_name: torchvision.transforms.Compose
        transforms:
          - _class_name: torchvision.transforms.Resize
            size: [256, 256]
          - _class_name: torchvision.transforms.ToTensor
  pop_list: [images]

dataloader:
  _class_name: torch.utils.data.DataLoader
  batch_size: 2
  shuffle: true
  num_workers: 2
  persistent_workers: true
  pin_memory: true
  collate_fn:
    _class_name: dwm.datasets.common.CollateFnIgnoring
    keys: [boxes, labels, track_ids, sample_ids, sequence]

# 配置讲解：style 模式使用同一组 dataset.py/common.py，只把 annotation_mode
# 设为 none；所有有效热红外视频进入训练，但不生成或消费 bbox condition。
# firestereo 当前为空，因此不伪造数据并暂不加入；VIVID_ROOT 指向 raw bags，
# max_frames_per_bag=256 是显式的每个 bag 上限，可改为 null 取完整内容。
