[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native16-gligen"
version = "0.1.0"
description = "Reproducible Native16 thermal box-conditioned GLIGEN training and inference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Native16 GLIGEN contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==1.26.4",
  "Pillow==10.4.0",
  "PyYAML==6.0.2",
  "tqdm==4.66.5",
]

[project.optional-dependencies]
train = [
  "accelerate==0.34.2",
  "diffusers==0.30.3",
  "transformers==4.44.2",
  "safetensors==0.4.5",
  "huggingface-hub==0.24.7",
  "tensorboard==2.17.1",
]
eval = [
  "torchmetrics>=1.4",
  "torch-fidelity>=0.3",
]
test = ["pytest==8.3.3"]
all = [
  "accelerate==0.34.2",
  "diffusers==0.30.3",
  "transformers==4.44.2",
  "safetensors==0.4.5",
  "huggingface-hub==0.24.7",
  "tensorboard==2.17.1",
  "torchmetrics>=1.4",
  "torch-fidelity>=0.3",
  "pytest==8.3.3",
]

[project.scripts]
native16-train = "native16_gligen.train:train"
native16-generate = "native16_gligen.sample_native16:main"
native16-verify-tiffs = "native16_gligen.verify_tiffs:main"
native16-verify-parents = "native16_gligen.verify_parent_artifacts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
